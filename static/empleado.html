<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Avisar comandes</title>
<link rel="stylesheet" href="/static/estilo.css">
<style>
  body { min-height: 100vh; }
  .barra {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 16px; border-bottom: 1px solid var(--borde); background: var(--superficie);
  }
  .barra h1 { margin: 0; font-size: 1.1rem; }
  .barra nav { display: flex; gap: 8px; align-items: center; }
  .enlace { white-space: nowrap; background: none; border: 1px solid var(--borde); color: var(--texto); border-radius: 8px; padding: 6px 10px; font-size: .9rem; text-decoration: none; }
  .punto { width: 10px; height: 10px; border-radius: 50%; background: var(--peligro); display: inline-block; }
  .conectado .punto { background: var(--acento); }
  main {
    display: grid; gap: 16px; padding: 16px; max-width: 1000px; margin: 0 auto;
    grid-template-columns: minmax(0, 1fr);
  }
  @media (min-width: 760px) { main { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; } }
  .panel { background: var(--superficie); border: 1px solid var(--borde); border-radius: 14px; padding: 16px; }
  #pantalla {
    font-size: 3.4rem; font-weight: 800; text-align: center; font-variant-numeric: tabular-nums;
    min-height: 1.3em; line-height: 1.3; border-radius: 10px; background: var(--fondo); margin-bottom: 12px;
  }
  #pantalla:empty::before { content: "—"; color: var(--suave); font-weight: 400; }
  .teclado { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .teclado button {
    font-size: 1.7rem; font-weight: 600; padding: 16px 0; border-radius: 12px;
    border: 1px solid var(--borde); background: var(--fondo); color: var(--texto);
    touch-action: manipulation;
  }
  .teclado button:active { transform: scale(.97); }
  .teclado .borrar { font-size: 1.2rem; }
  .fila-avisar { display: flex; gap: 8px; margin-top: 10px; }
  #avisar { flex: 1; font-size: 1.4rem; padding: 18px; }
  #avisar:disabled { opacity: .45; cursor: default; }
  .mensaje { min-height: 1.4em; margin: 10px 0 0; text-align: center; color: var(--suave); }
  .mensaje.error { color: var(--peligro); }
  #desfer {
    flex: 0 0 38%; padding: 6px 8px; border-radius: 10px; min-width: 0;
    border: 1px dashed var(--borde); background: none; color: var(--texto);
    display: flex; flex-direction: column; justify-content: center; line-height: 1.2;
  }
  #desfer b { font-size: 1rem; }
  #desfer small {
    font-size: .75rem; color: var(--suave);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%;
  }
  /* Mòbil: el teclat s'adapta a l'alçada perquè es vegi també l'inici de la llista */
  @media (max-width: 759px) {
    .barra { padding: 8px 12px; }
    main { padding: 10px; gap: 10px; }
    .panel { padding: 10px; }
    #pantalla { font-size: clamp(2rem, 7dvh, 3rem); line-height: 1.25; margin-bottom: 8px; }
    .teclado { gap: 6px; }
    .teclado button { padding: clamp(5px, 1.3dvh, 14px) 0; font-size: clamp(1.25rem, 3.6dvh, 1.7rem); }
    .teclado .borrar { font-size: 1rem; }
    .fila-avisar { margin-top: 8px; }
    #avisar { padding: clamp(10px, 1.8dvh, 16px); font-size: 1.25rem; }
    .mensaje { margin-top: 6px; font-size: .9rem; min-height: 1.2em; }
    .mensaje:empty { margin: 0; min-height: 0; }
    .cabecera-lista { margin-bottom: 6px; }
    .accions-sel button { padding: 10px 4px; }
  }
  .cabecera-lista { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 8px; }
  .cabecera-lista h2 { margin: 0; font-size: 1.05rem; }
  .accions-sel { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 10px; }
  .accions-sel button {
    border: 1px solid var(--borde); background: var(--fondo); color: var(--texto);
    border-radius: 10px; padding: 12px 6px; font-weight: 600;
  }
  .accions-sel button:disabled { opacity: .4; cursor: default; }
  .accions-sel .entregar { background: var(--entrega); border-color: var(--entrega); color: #fff; }
  .accions-sel .quitar { color: var(--peligro); }
  .accion { border: 1px solid var(--borde); background: var(--fondo); color: var(--texto); border-radius: 8px; padding: 8px 10px; font-size: .9rem; }
  .quitar { color: var(--peligro); }
  #lista {
    list-style: none; margin: 0; padding: 0;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 8px;
  }
  .quadret {
    width: 100%; aspect-ratio: 1; border-radius: 12px; position: relative;
    border: 2px solid var(--borde); background: var(--fondo); color: var(--texto);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .quadret .num { font-size: 1.7rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
  .quadret .hace { font-size: .7rem; color: var(--suave); }
  .quadret[aria-pressed="true"] { border-color: var(--acento); background: var(--acento); color: var(--acento-texto); }
  .quadret[aria-pressed="true"] .hace { color: var(--acento-texto); }
  .quadret[aria-pressed="true"]::after {
    content: "✓"; position: absolute; top: 4px; right: 7px; font-size: .85rem; font-weight: 800;
  }
  .quadret.remarcada { background: var(--groc-fons); border-color: var(--groc); }
  .quadret.tard { background: var(--vermell-fons); border-color: var(--vermell); }
  .quadret.entregada { background: var(--entrega-fons); border-color: var(--entrega); opacity: .7; cursor: default; }
  .llegenda { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 10px 0 0; font-size: .8rem; color: var(--suave); }
  .llegenda span::before {
    content: ""; display: inline-block; width: .8em; height: .8em; border-radius: 3px;
    margin-right: 5px; vertical-align: -1px; border: 1px solid;
  }
  .llegenda .l-groc::before { background: var(--groc-fons); border-color: var(--groc); }
  .llegenda .l-vermell::before { background: var(--vermell-fons); border-color: var(--vermell); }
  dialog {
    border: 1px solid var(--borde); border-radius: 14px; padding: 0; width: min(420px, calc(100% - 32px));
    background: var(--superficie); color: var(--texto);
  }
  dialog::backdrop { background: rgb(0 0 0 / .45); }
  dialog form { display: grid; gap: 10px; padding: 20px; }
  dialog h2 { margin: 0 0 4px; font-size: 1.2rem; }
  .camp { display: grid; gap: 4px; }
  .camp small { color: var(--suave); font-size: .8rem; }
  .camp input { width: 7em; }
  .botons-dlg { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }
  .botons-dlg button { padding: 10px 16px; }
  .secundari { border: 1px solid var(--borde); background: none; color: var(--texto); border-radius: 10px; }
  #lista .vacia { grid-column: 1 / -1; }
  .vacia { color: var(--suave); text-align: center; padding: 16px 0; }
  :root {
    --entrega: #2f6fd1; --entrega-fons: #e3edfc;
    --groc: #d9a400; --groc-fons: #fff4c7;
    --vermell: #e0605a; --vermell-fons: #fde2e0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --entrega: #4c9dff; --entrega-fons: #16263d;
      --groc: #d9a400; --groc-fons: #3a3214;
      --vermell: #e0605a; --vermell-fons: #3d1d1b;
    }
  }
</style>
</head>
<body>
<div class="barra">
  <h1>Comandes</h1>
  <nav>
    <span id="conexion" title="Connexió"><span class="punto"></span></span>
    <a class="enlace" href="/visor">Visor</a>
    <button class="enlace" id="obrirConfig" type="button" aria-label="Configuració" title="Configuració">⚙</button>
    <button class="enlace" id="salir" type="button">Sortir</button>
  </nav>
</div>
<main>
  <section class="panel">
    <div id="pantalla" aria-live="polite"></div>
    <div class="teclado">
      <button type="button" data-d="1">1</button><button type="button" data-d="2">2</button><button type="button" data-d="3">3</button>
      <button type="button" data-d="4">4</button><button type="button" data-d="5">5</button><button type="button" data-d="6">6</button>
      <button type="button" data-d="7">7</button><button type="button" data-d="8">8</button><button type="button" data-d="9">9</button>
      <button type="button" class="borrar" id="limpiar">Esborrar</button>
      <button type="button" data-d="0">0</button>
      <button type="button" class="borrar" id="retroceso" aria-label="Esborrar l'última xifra">⌫</button>
    </div>
    <div class="fila-avisar">
      <button type="button" class="primario" id="avisar" disabled>Avisar</button>
      <button type="button" id="desfer" hidden><b>↶ Desfer</b><small id="desferText"></small></button>
    </div>
    <p class="mensaje" id="mensaje"></p>
  </section>
  <section class="panel">
    <div class="cabecera-lista">
      <h2 id="titolLlista">Al visor</h2>
      <button type="button" class="accion quitar" id="vaciar" hidden>Eliminar-les totes</button>
    </div>
    <div class="accions-sel">
      <button type="button" id="remarcar" disabled>Remarcar</button>
      <button type="button" id="entregar" class="entregar" disabled>Entregada</button>
      <button type="button" id="eliminar" class="quitar" disabled>Eliminar</button>
    </div>
    <ul id="lista"></ul>
    <p class="llegenda"><span class="l-groc">Remarcada</span><span class="l-vermell" id="llegendaVermell"></span></p>
  </section>
</main>
<dialog id="dlgConfig">
  <form id="formConfig">
    <h2>Configuració</h2>
    <label class="camp">Minuts sense entregar per marcar-la en vermell
      <input id="cfgAlerta" type="number" min="0" max="240" step="1" inputmode="numeric" required>
      <small>Des que s'avisa per primer cop. 0 = mai.</small>
    </label>
    <label class="camp">Minuts per treure-la sola del visor
      <input id="cfgExpira" type="number" min="0" max="1440" step="1" inputmode="numeric" required>
      <small>Des de l'últim avís. 0 = mai.</small>
    </label>
    <p class="error" id="cfgError"></p>
    <div class="botons-dlg">
      <button type="button" class="secundari" id="tancarConfig">Cancel·lar</button>
      <button type="submit" class="primario">Desar</button>
    </div>
  </form>
</dialog>
<script>
const $ = (id) => document.getElementById(id);
let numero = '';
let maxDigitos = 4;
let estado = null;

function pintarNumero() {
  $('pantalla').textContent = numero;
  $('avisar').disabled = numero === '';
}

function teclear(d) {
  if (numero.length >= maxDigitos) return;
  numero = (numero === '0' ? '' : numero) + d;
  $('mensaje').textContent = '';
  pintarNumero();
}

document.querySelectorAll('[data-d]').forEach((b) => b.addEventListener('click', () => teclear(b.dataset.d)));
$('retroceso').addEventListener('click', () => { numero = numero.slice(0, -1); pintarNumero(); });
$('limpiar').addEventListener('click', () => { numero = ''; pintarNumero(); });
$('avisar').addEventListener('click', () => avisar(numero));
document.addEventListener('keydown', (e) => {
  if ($('dlgConfig').open || e.target.closest('input')) return;
  if (/^[0-9]$/.test(e.key)) teclear(e.key);
  else if (e.key === 'Backspace') { numero = numero.slice(0, -1); pintarNumero(); }
  else if (e.key === 'Escape') { numero = ''; pintarNumero(); }
  else if (e.key === 'Enter' && numero) { e.preventDefault(); avisar(numero); }
});

function aviso(texto, error) {
  $('mensaje').textContent = texto;
  $('mensaje').classList.toggle('error', !!error);
}

async function api(metodo, ruta, cuerpo) {
  const r = await fetch(ruta, {
    method: metodo,
    headers: cuerpo ? {'Content-Type': 'application/json'} : {},
    body: cuerpo ? JSON.stringify(cuerpo) : undefined,
  });
  if (r.status === 401) { location.href = '/'; throw new Error('Sessió caducada'); }
  const datos = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(typeof datos.detail === 'string' ? datos.detail : 'Error ' + r.status);
  return datos;
}

async function accio(fn, missatge) {
  try { await fn(); aviso(missatge); }
  catch (e) { aviso(e.message, true); }
}

async function avisar(n) {
  try {
    const p = await api('POST', '/api/v1/pedidos', {numero: n});
    aviso(p.avisos > 1 ? `Comanda ${p.numero} avisada de nou` : `Comanda ${p.numero} al visor`);
    if (n === numero) { numero = ''; pintarNumero(); }
  } catch (e) { aviso(e.message, true); }
}

// Selecció de comandes (en ordre de selecció)
let seleccio = [];

function nomComandes(ns, singular, plural) {
  return ns.length === 1 ? `Comanda ${ns[0]} ${singular}` : `Comandes ${ns.join(', ')} ${plural}`;
}

async function ambSeleccio(fn) {
  const ns = seleccio.slice();
  if (!ns.length) return;
  seleccio = [];
  pintarLista();
  try { aviso(await fn(ns)); }
  catch (e) { aviso(e.message, true); }
}

$('entregar').addEventListener('click', () => ambSeleccio(async (ns) => {
  const r = await api('POST', '/api/v1/pedidos/entregar', {numeros: ns});
  return r.entregados.length ? nomComandes(r.entregados, 'entregada', 'entregades') : 'Ja no eren al visor';
}));
$('eliminar').addEventListener('click', () => ambSeleccio(async (ns) => {
  const r = await api('POST', '/api/v1/pedidos/eliminar', {numeros: ns});
  return r.eliminados.length ? nomComandes(r.eliminados, 'eliminada', 'eliminades') : 'Ja no eren al visor';
}));
$('remarcar').addEventListener('click', () => ambSeleccio(async (ns) => {
  for (const n of ns) await api('POST', `/api/v1/pedidos/${encodeURIComponent(n)}/avisar`);
  return nomComandes(ns, 'remarcada', 'remarcades');
}));

function triar(n) {
  seleccio = seleccio.includes(n) ? seleccio.filter((x) => x !== n) : [...seleccio, n];
  $('mensaje').textContent = '';
  pintarLista();
}

$('vaciar').addEventListener('click', () => {
  if (!confirm('Vols eliminar totes les comandes del visor?')) return;
  accio(() => api('DELETE', '/api/v1/pedidos'), 'Visor buit');
});

$('desfer').addEventListener('click', async () => {
  try {
    const r = await api('POST', '/api/v1/deshacer');
    aviso(`Desfet: ${r.deshecho}`);
  } catch (e) { aviso(e.message, true); }
});

$('salir').addEventListener('click', async () => { await fetch('/api/logout', {method: 'POST'}); location.href = '/'; });

function hace(segundos) {
  const m = Math.floor(segundos / 60);
  return m < 1 ? 'ara mateix' : `fa ${m} min`;
}

function pintarLista() {
  if (!estado) return;
  const desfase = Date.now() / 1000 - estado.recibido;
  $('desfer').hidden = !estado.deshacer;
  $('desferText').textContent = estado.deshacer || '';
  $('desfer').title = estado.deshacer ? `Desfer: ${estado.deshacer}` : '';
  const actives = estado.pedidos.filter((p) => !p.entregado).map((p) => p.numero);
  seleccio = seleccio.filter((n) => actives.includes(n));
  const quantes = seleccio.length;
  const alertaMin = estado.config.alerta_minutos;
  $('llegendaVermell').hidden = !(alertaMin > 0);
  $('llegendaVermell').textContent = `Més de ${alertaMin} min sense entregar`;
  $('titolLlista').textContent = quantes === 0 ? 'Al visor'
    : quantes === 1 ? '1 seleccionada' : `${quantes} seleccionades`;
  ['remarcar', 'entregar', 'eliminar'].forEach((id) => { $(id).disabled = quantes === 0; });
  $('vaciar').hidden = actives.length === 0;
  if (estado.pedidos.length === 0) {
    const li = document.createElement('li');
    li.className = 'vacia';
    li.textContent = 'No hi ha comandes al visor';
    $('lista').replaceChildren(li);
    return;
  }
  $('lista').replaceChildren(...estado.pedidos.map((p) => {
    const li = document.createElement('li');
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'quadret';
    const num = document.createElement('span');
    num.className = 'num'; num.textContent = p.numero;
    const sub = document.createElement('span');
    sub.className = 'hace';
    if (p.entregado) {
      b.classList.add('entregada');
      b.disabled = true;
      sub.textContent = 'entregada';
    } else {
      b.setAttribute('aria-pressed', seleccio.includes(p.numero) ? 'true' : 'false');
      const espera = estado.ahora + desfase - p.listo_en;
      const alerta = estado.config.alerta_minutos;
      if (alerta > 0 && espera >= alerta * 60) b.classList.add('tard');
      else if (p.avisos > 1) b.classList.add('remarcada');
      sub.textContent = hace(espera);
      b.addEventListener('click', () => triar(p.numero));
    }
    b.append(num, sub);
    li.append(b);
    return li;
  }));
}
setInterval(pintarLista, 15000);

// Configuració
$('obrirConfig').addEventListener('click', () => {
  if (!estado) return;
  $('cfgAlerta').value = estado.config.alerta_minutos;
  $('cfgExpira').value = estado.config.expira_minutos;
  $('cfgError').textContent = '';
  $('dlgConfig').showModal();
});
$('tancarConfig').addEventListener('click', () => $('dlgConfig').close());
$('formConfig').addEventListener('submit', async (e) => {
  e.preventDefault();
  try {
    await api('PUT', '/api/v1/config', {
      alerta_minutos: Number($('cfgAlerta').value),
      expira_minutos: Number($('cfgExpira').value),
    });
    $('dlgConfig').close();
    aviso('Configuració desada');
  } catch (err) { $('cfgError').textContent = err.message; }
});

function conectar() {
  const fuente = new EventSource('/api/v1/eventos');
  fuente.addEventListener('estado', (e) => {
    $('conexion').classList.add('conectado');
    estado = JSON.parse(e.data);
    estado.recibido = Date.now() / 1000;
    maxDigitos = estado.max_digitos;
    pintarLista();
  });
  fuente.onerror = async () => {
    $('conexion').classList.remove('conectado');
    try {
      const {rol} = await (await fetch('/api/sesion')).json();
      if (rol !== 'empleado') { fuente.close(); location.href = '/'; }
    } catch (e) { /* EventSource reintenta sol */ }
  };
}
pintarNumero();
conectar();
</script>
</body>
</html>
