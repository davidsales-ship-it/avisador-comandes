# Configuración para Render (Blueprint). Ver README, sección «Publicar en Render».
services:
  - type: web
    name: avisador-comandes
    runtime: python
    plan: free               # pruebas: sin disco, los pedidos se pierden al reiniciar
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    # Un solo proceso: los avisos en tiempo real se reparten desde memoria
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /api/salud
    envVars:
      - key: VISOR_PASSWORD
        sync: false          # Render la pide al crear el servicio
      - key: EMPLEADO_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true  # Render genera una clave aleatoria
      - key: API_KEY
        generateValue: true
      # Valors inicials; després es canvien des de ⚙ a la pantalla d'empleat
      - key: EXPIRA_MINUTOS
        value: "15"
      - key: ALERTA_MINUTOS
        value: "10"
      - key: MAX_DIGITOS
        value: "4"
      # - key: DB_PATH
      #   value: /var/data/avisador.db
    # Para producción: plan starter y descomenta el disco y DB_PATH
    # disk:
    #   name: datos
    #   mountPath: /var/data
    #   sizeGB: 1
